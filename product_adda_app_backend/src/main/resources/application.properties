# ===================================================================
# Application Core Configuration
# ===================================================================
# The name of your Spring Boot application
spring.application.name=productadda

# ===================================================================
# Database Connection Settings (MySQL)
# ===================================================================
# The JDBC connection URL pointing to your local MySQL schema
spring.datasource.url=jdbc:mysql://localhost:3306/product_adda_db

# The database username and password used to connect
spring.datasource.username=productaddaAppServiceAcc
spring.datasource.password=codeaxisFuison1

# ===================================================================
# JPA / Hibernate Configurations
# ===================================================================
# Validates the database schema matches your Java Entity classes on startup.
# It won't make any changes to your tables, which is safe for production.
spring.jpa.hibernate.ddl-auto=validate

# CHANGED: Set to false to stop Hibernate from printing SQL queries to your terminal.
# (Change back to true later if you need to debug your database queries).
spring.jpa.show-sql=false

# Formats the printed SQL to make it pretty and readable. 
# Since show-sql is now false, this setting will sleep until you turn show-sql back on.
spring.jpa.properties.hibernate.format_sql=true

# TimeZone: UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Force Hibernate to use the standard UUID binary representation globally
spring.jpa.properties.hibernate.type.preferred_uuid_binary_desc=STANDARD

# ===================================================================
# Advanced Logging Control
# ===================================================================

# Set Hibernate SQL logger to INFO to keep the terminal clean.
# To see SQL queries formatted neatly through the regular Spring logger, 
# leave show-sql=false above, and uncomment the line below:
# (Change 'info' to 'DEBUG' if you want to see SQL queries with proper timestamps)
logging.level.org.hibernate.SQL=info

# Set result-set logger to INFO so it doesn't dump raw database rows into the console.
# (Change 'info' to 'TRACE' if you ever need to debug the exact data coming out of rows)
logging.level.org.hibernate.orm.results=info

